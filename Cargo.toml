[package]
name = "eth-vanity"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.1"
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.4", features = ["derive"] }
ctr = "0.10.1"
ctrlc = "3.5.2"
eth-keystore = "0.5.0"
hex = "0.4.3"
k256 = { version = "0.14.0", features = ["arithmetic", "ecdsa"] }
keccak-asm = "0.1.8"
rand = "0.10"
rpassword = "7.5.4"
scrypt = { version = "0.12.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.3.0", features = ["json"] }
uuid = { version = "0.8", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
